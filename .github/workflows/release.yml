name: Release macOS desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version to validate without signing or publishing
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select release version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: printf 'RELEASE_VERSION=%s\n' "${REQUESTED_VERSION#v}" >> "$GITHUB_ENV"
      - name: Test appcast validation fixtures
        run: python3 -m unittest discover -s scripts/tests
      - name: Validate authored release notes
        run: python3 scripts/release_notes.py "$RELEASE_VERSION" "release-notes/$RELEASE_VERSION.md"
      - name: Import pinned release signing identity
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          PERSONASTACK_CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.PERSONASTACK_DEVELOPER_ID_P12_BASE64 }}
          PERSONASTACK_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.PERSONASTACK_DEVELOPER_ID_PASSWORD }}
          PERSONASTACK_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.PERSONASTACK_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          PERSONASTACK_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.PERSONASTACK_DEVELOPER_ID_INSTALLER_PASSWORD }}
        run: ./scripts/import-release-signing.sh
      - name: Test signing identity across updates
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/test-signing-continuity.sh
      - name: Configure Apple notarization
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_KEY: ${{ secrets.PERSONASTACK_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.PERSONASTACK_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.PERSONASTACK_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          umask 077
          : "${NOTARY_KEY:?Apple notarization key is required}"
          : "${NOTARY_KEY_ID:?Apple notarization key ID is required}"
          : "${NOTARY_ISSUER_ID:?Apple notarization issuer ID is required}"
          key_path="$RUNNER_TEMP/personastack-notary.p8"
          printf '%s' "$NOTARY_KEY" | /usr/bin/openssl base64 -d -A > "$key_path"
          xcrun notarytool history --key "$key_path" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --output-format json >/dev/null
          printf 'PERSONASTACK_NOTARY_KEY_PATH=%s\nPERSONASTACK_NOTARY_KEY_ID=%s\nPERSONASTACK_NOTARY_ISSUER_ID=%s\n' \
            "$key_path" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Validate updater release configuration
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.PERSONASTACK_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.PERSONASTACK_SPARKLE_PRIVATE_ED_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$SPARKLE_PUBLIC_KEY" ] || [ -z "$SPARKLE_PRIVATE_KEY" ] || [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Sparkle public key, Sparkle private key, and Homebrew tap token must be configured before a release." >&2
            exit 1
          fi
          derived_public_key=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | swift scripts/derive-sparkle-public-key.swift)
          if [ "$derived_public_key" != "$SPARKLE_PUBLIC_KEY" ]; then
            echo "Sparkle public and private keys do not match." >&2
            exit 1
          fi
      - name: Test native release changes
        run: |
          swift package resolve
          # -j limits compilation only. Bound Swift Testing's process fixtures
          # separately so scheduler starvation cannot defeat interrupt deadlines.
          if swift test --help-hidden | grep -q -- '--experimental-maximum-parallelization-width'; then
            test_scheduling=(--experimental-maximum-parallelization-width 2)
          else
            test_scheduling=(--no-parallel)
          fi
          swift test --disable-xctest --skip-update -j 2 \
            "${test_scheduling[@]}" \
            --filter '(LocalRun|LocalSession|[Hh]arness|[Ss]kill|[Dd]esktop|ChatWindow|Popout|[Nn]avigation|MainWebView|[Pp]ermission|[Pp]rotected|[Vv]olume|[Vv]oice|[Mm]icrophone|[Dd]irectory|[Cc]ua|[Nn]otification|[Cc]oncern|[Kk]eychain|[Cc]redential|[Ll]ogin)'
      - name: Build certificate-signed installer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          PERSONASTACK_DEFAULT_URL: https://my.personastack.ai/user/personas
          PERSONASTACK_SPARKLE_PUBLIC_ED_KEY: ${{ vars.PERSONASTACK_SPARKLE_PUBLIC_ED_KEY }}
        run: VERSION="$RELEASE_VERSION" ./scripts/package-macos.sh
      - name: Build validation binaries
        if: github.event_name == 'workflow_dispatch'
        run: |
          swift run PersonaStackPolicyCheck
          for architecture in arm64 x86_64; do
            swift build --scratch-path "build/validation-$architecture" \
              --triple "$architecture-apple-macosx14.0" -c release --product PersonaStack
          done
      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Refusing to replace its immutable installer." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "artifacts/PersonaStack-$RELEASE_VERSION-developerid.dmg" \
            --notes-file "release-notes/${GITHUB_REF_NAME#v}.md" --title "PersonaStack $GITHUB_REF_NAME"
      - name: Publish Homebrew cask
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.PERSONASTACK_SPARKLE_PRIVATE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish the Homebrew cask." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tap_tag="desktop-v$version"
          tap_dir=$(mktemp -d)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/personastack/homebrew-tap.git" "$tap_dir"
          cd "$tap_dir"
          if git rev-parse -q --verify "refs/tags/$tap_tag" >/dev/null; then
            echo "Homebrew installer tag $tap_tag already exists." >&2
            exit 1
          fi
          if GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh release view --repo personastack/homebrew-tap "$tap_tag" >/dev/null 2>&1; then
            echo "Homebrew release $tap_tag already exists." >&2
            exit 1
          fi
          mkdir -p Casks Downloads
          cp "$GITHUB_WORKSPACE/artifacts/PersonaStack-$version-developerid.dmg" Downloads/
          current_dmg="Downloads/PersonaStack-$version-developerid.dmg"
          test -f "$current_dmg"
          "$GITHUB_WORKSPACE"/scripts/render-homebrew-cask.sh "$version" "$current_dmg" Casks/personastack.rb
          grep -q '^  auto_updates true$' Casks/personastack.rb
          git add Casks/personastack.rb Downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish PersonaStack cask $version"
          git tag -a "$tap_tag" -m "PersonaStack $version"
          git push origin HEAD:main "refs/tags/$tap_tag"
          latest_dmg="$RUNNER_TEMP/PersonaStack-latest.dmg"
          cp "$current_dmg" "$latest_dmg"
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh release create \
            --repo personastack/homebrew-tap \
            "$tap_tag" "$current_dmg" "$latest_dmg" \
            --title "PersonaStack $version" \
            --notes-file "$GITHUB_WORKSPACE/release-notes/$version.md" \
            --latest
          gh release view -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --json body -q .body \
            >"$tap_dir/Downloads/PersonaStack-$version-developerid.md"
          sparkle_zip=$(mktemp)
          sparkle_dir=$(mktemp -d)
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip -o "$sparkle_zip"
          echo "17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959  $sparkle_zip" | shasum -a 256 -c -
          unzip -q "$sparkle_zip" -d "$sparkle_dir"
          chmod 755 "$sparkle_dir/bin/generate_appcast"
          chmod 755 "$sparkle_dir/bin/sign_update"
          archive_dir="$sparkle_dir/archives"
          mkdir -p "$archive_dir"
          if [ -f appcast.xml ]; then cp appcast.xml "$archive_dir/appcast.xml"; fi
          archive_signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/sign_update" \
            --ed-key-file - -p "$GITHUB_WORKSPACE/artifacts/PersonaStack-$version-developerid.dmg")
          python3 "$GITHUB_WORKSPACE/scripts/render-package-appcast.py" \
            "$version" "$GITHUB_WORKSPACE/artifacts/PersonaStack-$version-developerid.dmg" \
            "$GITHUB_WORKSPACE/release-notes/$version.md" "$archive_signature" "$archive_dir/appcast.xml"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/sign_update" \
            --ed-key-file - "$archive_dir/appcast.xml"
          cp "$archive_dir/appcast.xml" "$tap_dir/appcast.xml"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/sign_update" \
            --ed-key-file - --verify "$GITHUB_WORKSPACE/artifacts/PersonaStack-$version-developerid.dmg" "$archive_signature"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/sign_update" \
            --ed-key-file - --verify "$tap_dir/appcast.xml"
          python3 "$GITHUB_WORKSPACE/scripts/validate-appcast.py" \
            "$tap_dir/appcast.xml" "$version" "$tap_tag" \
            "$GITHUB_WORKSPACE/artifacts/PersonaStack-$version-developerid.dmg" "$tap_dir/Casks/personastack.rb" \
            "$GITHUB_WORKSPACE/release-notes/$version.md"
          cd "$tap_dir"
          git add appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish signed PersonaStack appcast $version"
          git push origin HEAD:main
      - name: Remove temporary signing keychain
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          signing_dir="$RUNNER_TEMP/personastack-release-signing"
          if [ -f "$signing_dir/signing.keychain-db" ]; then
            security delete-keychain "$signing_dir/signing.keychain-db"
          fi
          rm -rf "$signing_dir"
          rm -f "$RUNNER_TEMP/personastack-notary.p8"
