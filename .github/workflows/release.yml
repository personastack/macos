name: Release macOS desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned installer
        env:
          PERSONASTACK_DEFAULT_URL: https://my.personastack.ai/user/personas
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/package-macos.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.dmg --generate-notes --title "PersonaStack $GITHUB_REF_NAME"
          fi
      - name: Publish Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish the Homebrew cask." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tap_tag="desktop-v$version"
          tap_dir=$(mktemp -d)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/personastack/homebrew-tap.git" "$tap_dir"
          cd "$tap_dir"
          if git rev-parse -q --verify "refs/tags/$tap_tag" >/dev/null; then
            echo "Homebrew installer tag $tap_tag already exists." >&2
            exit 1
          fi
          mkdir -p Casks Downloads
          cp "$GITHUB_WORKSPACE"/artifacts/*.dmg Downloads/
          "$GITHUB_WORKSPACE"/scripts/render-homebrew-cask.sh "$version" Downloads/*.dmg Casks/personastack.rb
          git add Casks/personastack.rb Downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish PersonaStack cask $version"
          git tag -a "$tap_tag" -m "PersonaStack $version"
          git push origin HEAD:main "refs/tags/$tap_tag"
