name: Validate macOS source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    # Official runner reference: docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require an Apple Silicon build host
        run: test "$(uname -m)" = arm64
      - name: Resolve public Swift dependencies
        run: swift package resolve
      - name: Test native source contracts
        run: |
          python3 -m unittest discover -s scripts/tests
          if swift test --help-hidden | grep -q -- '--experimental-maximum-parallelization-width'; then
            scheduling=(--experimental-maximum-parallelization-width 2)
          else
            scheduling=(--no-parallel)
          fi
          swift test --triple arm64-apple-macosx14.0 --disable-xctest --skip-update -j 2 "${scheduling[@]}" \
            --filter '(AgentBridge|LocalSession|[Cc]ua|[Dd]esktop|Termination|Quit|[Cc]oncern|[Nn]otification|MainWebView|MainWindow|ChatWindow|StackPopout|PopoutWindow|[Nn]avigation|ServerSettings|[Hh]arness|[Ii]Message|[Cc]redential)'
      - name: Build ARM64 app without signing
        run: |
          swift build --scratch-path build/validation-arm64 \
            --triple arm64-apple-macosx14.0 -c release --product PersonaStack

  helper:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: off
      GOSUMDB: off
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require an Apple Silicon build host
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-bridge/go.mod
          cache-dependency-path: agent-bridge/go.sum
      - name: Test helper source and Darwin Keychain boundary
        run: cd agent-bridge && go test -parallel "$(sysctl -n hw.logicalcpu)" ./...
      - name: Build ARM64 helper without signing
        run: |
          ./scripts/build-agent-bridge.sh build/validation-agent-bridge 0.0.0
          test "$(build/validation-agent-bridge/PersonaStackAgentBridge --version)" = 0.0.0
